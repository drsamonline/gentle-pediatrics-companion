<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7fbfd">
<meta name="robots" content="noindex, follow">
<title>Page not found · Gentle Pediatrics — Home Companion</title>
<meta name="description" content="That page could not be found. Head back to the Gentle Pediatrics — Home Companion landing page or open the offline app.">
<link rel="icon" type="image/svg+xml" href="/gentle-pediatrics-companion/assets/logo.svg">
<style>
  :root{
    --sky:#0ea5e9; --mint:#34d399; --bg:#f7fbfd; --ink:#1f3442; --ink-soft:#4a6376; --muted:#6b8397;
    --line:#e3eff6; --blue-wash:#e8f5fd; --mint-wash:#e8faf1;
    --font:"Segoe UI", system-ui, -apple-system, "SF Pro Rounded", ui-rounded, "Trebuchet MS", "Nunito", Arial, sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
    background:
      radial-gradient(760px 420px at 8% -6%, #e6f6ff 0%, rgba(230,246,255,0) 62%),
      radial-gradient(700px 440px at 98% 4%, #e6fbf2 0%, rgba(230,251,242,0) 60%),
      var(--bg);
    color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:640px;width:100%;background:#fff;border:1px solid var(--line);border-radius:30px;
    padding:48px 42px;box-shadow:0 22px 50px rgba(14,80,110,.13);text-align:center;
  }
  .mark{width:76px;height:76px;border-radius:24px;margin-bottom:22px}
  .code{
    display:inline-block;font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:#0b6f9c;background:var(--blue-wash);border-radius:999px;padding:6px 15px;margin-bottom:18px;
  }
  h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.2;margin:0 0 14px;letter-spacing:-.015em}
  p{color:var(--ink-soft);margin:0 0 26px}
  .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;gap:9px;padding:14px 24px;border-radius:999px;font-weight:750;
    font-size:.98rem;border:1px solid transparent;text-decoration:none;
  }
  .btn svg{width:18px;height:18px}
  .btn-primary{background:linear-gradient(100deg,var(--sky) 0%,#38bdf8 55%,var(--mint) 130%);color:#fff;box-shadow:0 14px 28px rgba(14,165,233,.28)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .foot{margin-top:30px;font-size:.85rem;color:var(--muted)}
  a{color:#0284c7}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/gentle-pediatrics-companion/assets/logo.svg" alt="Gentle Pediatrics mark" width="76" height="76">
    <div class="code">Error 404</div>
    <h1>That page has wandered off</h1>
    <p>The page you were looking for is not here. Nothing is lost — the landing page and the offline app are both a tap away.</p>
    <div class="cta">
      <a class="btn btn-primary" href="/gentle-pediatrics-companion/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Go to the landing page
      </a>
      <a class="btn btn-ghost" href="/gentle-pediatrics-companion/play/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
        Open the app
      </a>
    </div>
    <p class="foot">Gentle Pediatrics — Home Companion · not a medical device · educational aid only</p>
  </main>
</body>
</html>
